name = "liecheatorsteal-com-v1"
main = "./src/worker.ts"
compatibility_date = "2026-07-02"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "liecheatorsteal.com"
custom_domain = true

[[routes]]
pattern = "www.liecheatorsteal.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
